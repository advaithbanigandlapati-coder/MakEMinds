<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;team&quot;,&quot;programs&quot;,&quot;robot&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const rnd = v => (Math.round(v * 100) / 100).toString();

function pillPath(r, radius) {
  const rr = Math.min(radius, r.width / 2, r.height / 2);
  const { x, y, width: w, height: h } = r;
  return ['M' + rnd(x) + ' ' + rnd(y + rr),
    'A' + rnd(rr) + ' ' + rnd(rr) + ' 0 0 1 ' + rnd(x + rr) + ' ' + rnd(y),
    'L' + rnd(x + w - rr) + ' ' + rnd(y),
    'A' + rnd(rr) + ' ' + rnd(rr) + ' 0 0 1 ' + rnd(x + w) + ' ' + rnd(y + rr),
    'L' + rnd(x + w) + ' ' + rnd(y + h - rr),
    'A' + rnd(rr) + ' ' + rnd(rr) + ' 0 0 1 ' + rnd(x + w - rr) + ' ' + rnd(y + h),
    'L' + rnd(x + rr) + ' ' + rnd(y + h),
    'A' + rnd(rr) + ' ' + rnd(rr) + ' 0 0 1 ' + rnd(x) + ' ' + rnd(y + h - rr), 'Z'].join(' ');
}

function waistPath(left, right, radius, neck, openness) {
  if (openness <= 0.02) return null;
  const h = left.height;
  const cy = left.y + h / 2;
  const r = Math.min(radius, h / 2, left.width / 2, right.width / 2);
  if (r <= 0) return null;
  const xa = left.x + left.width;
  const xb = right.x;
  const gap = xb - xa;
  if (gap < 0) return null;
  const waistHalf = Math.min((neck / 2) * openness, h / 2 - 0.5);
  const across = gap / 2 + r;
  const drop = waistHalf - h / 2 + r;
  const denom = 2 * (drop - r);
  if (Math.abs(denom) < 0.0001) return null;
  const fillet = (r * r - across * across - drop * drop) / denom;
  if (!(fillet > 0) || r + fillet < across) return null;
  const rise = Math.sqrt(Math.max(0, (r + fillet) * (r + fillet) - across * across));
  const midX = (xa + xb) / 2;
  const cornerX = xa - r;
  const cornerY = left.y + r;
  const vx = midX - cornerX;
  const vy = left.y + r - rise - cornerY;
  const len = Math.hypot(vx, vy) || 1;
  const tax = cornerX + (r * vx) / len;
  const tay = cornerY + (r * vy) / len;
  const tbx = 2 * midX - tax;
  return ['M' + rnd(tax) + ' ' + rnd(tay),
    'A' + rnd(fillet) + ' ' + rnd(fillet) + ' 0 0 0 ' + rnd(tbx) + ' ' + rnd(tay),
    'L' + rnd(tbx) + ' ' + rnd(2 * cy - tay),
    'A' + rnd(fillet) + ' ' + rnd(fillet) + ' 0 0 0 ' + rnd(tax) + ' ' + rnd(2 * cy - tay), 'Z'].join(' ');
}

class Component extends DCLogic {
  static COPY = [
    ['Home', 'Mission, the season film, and where we stand right now.'],
    ['Team', 'Roster, roles, build leads, mentor crew.'],
    ['Programs', 'FTC, FLL, HackEMinds, outreach. Season timeline.'],
    ['Robot', 'Current-season robot. Specs. Subsystems.'],
    ['Achievements', '27 events, 8 awards, climbing.'],
    ['Sponsors', 'Who funds the build. Sponsor packet.'],
    ['Notebook', 'Engineering blog. Build-season tags.'],
    ['Contact', 'Talk to us. Sponsor, mentor, judge, partner.']
  ];

  componentDidMount() {
    this.push = 10;
    this.open = [];
    this.hovered = null;
    this.pointerIn = false;
    this.smooth = 0;
    this.target = 0;
    this.history = [];
    this.last = performance.now();
    // The loop is the whole component; nothing in setup is allowed to stop it
    // from starting, or the header freezes with an empty shape.
    try { this.collect(); } catch (e) { console.error('chrome collect', e); }
    try { this.bind(); } catch (e) { console.error('chrome bind', e); }
    this._raf = requestAnimationFrame(t => this.tick(t));
    // rAF is paused while the tab or preview is hidden, so the shape is also
    // drawn straight away and on every wake — never left empty.
    this.drawNav(16);
    this._wake = () => { this.last = performance.now(); this.drawNav(16); };
    document.addEventListener('visibilitychange', this._wake);
    window.addEventListener('focus', this._wake);
  }

  componentDidUpdate() { this.collect(); this.drawNav(16); }

  collect() {
    const d = document;
    this.topbar = d.getElementById('topbar');
    this.brand = this.topbar && this.topbar.querySelector('a');
    this.navWrap = d.getElementById('nav-wrap');
    this.navMini = d.getElementById('nav-mini');
    this.navBase = d.getElementById('nav-base');
    this.navHalo = d.getElementById('nav-halo');
    this.navGrad = d.getElementById('nav-glow');
    this.navItems = Array.from(d.querySelectorAll('[data-nav]'));
    this.bulb = d.getElementById('bulb');
    this.bulbRail = d.getElementById('bulb-rail');
    this.trail = Array.from(d.querySelectorAll('[data-trail]'));
    if (this.open.length !== Math.max(0, this.navItems.length - 1)) {
      this.open = new Array(Math.max(0, this.navItems.length - 1)).fill(0);
    }
    // The pills are the home page's own sections, so on the home page the dot
    // follows the section being read; on a subpage no pill is current.
    this.sections = this.navItems.map(a => d.getElementById(a.dataset.hash));
    this.onHome = this.sections.some(Boolean);
    if (!this.onHome) this.active = -1;
    this.navItems.forEach(a => {
      if (a.dataset.wired) return;
      a.dataset.wired = '1';
      a.addEventListener('click', e => {
        const target = document.getElementById(a.dataset.hash);
        if (!target) return; // a subpage: let the link load the home page
        e.preventDefault();
        this.glide(target);
      });
    });

    this.menu = d.getElementById('menu-overlay');
    if (this.menu) {
      const bars = d.getElementById('menu-bars');
      this.menuBars = bars ? Array.from(bars.children) : [];
      this.menuContent = d.getElementById('menu-content');
      this.menuLabel = d.getElementById('menu-label');
      this.menuBlurb = d.getElementById('menu-blurb');
      const btn = d.getElementById('menu-btn');
      const close = d.getElementById('menu-close');
      if (btn && !btn.dataset.wired) { btn.dataset.wired = '1'; btn.addEventListener('click', () => this.setMenu(true)); }
      if (close && !close.dataset.wired) { close.dataset.wired = '1'; close.addEventListener('click', () => this.setMenu(false)); }
      Array.from(d.querySelectorAll('[data-menu-item]')).forEach(a => {
        if (a.dataset.wired) return;
        a.dataset.wired = '1';
        const i = Number(a.dataset.menuItem);
        const show = () => {
          const c = Component.COPY[i];
          if (!c) return;
          if (this.menuLabel) this.menuLabel.textContent = c[0];
          if (this.menuBlurb) this.menuBlurb.textContent = c[1];
        };
        a.addEventListener('mouseenter', show);
        a.addEventListener('focus', show);
      });
      if (!this._esc) {
        this._esc = e => { if (e.key === 'Escape') this.setMenu(false); };
        window.addEventListener('keydown', this._esc);
      }
    }
  }

  bind() {
    this._read = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      this.target = max > 0 ? clamp01(window.scrollY / max) : 0;
    };
    this._read();
    window.addEventListener('scroll', this._read, { passive: true });
    window.addEventListener('resize', this._read);

    this._pointer = e => {
      if (!this.navWrap || this.navWide === false) return;
      const b = this.navWrap.getBoundingClientRect();
      const inside = e.clientX >= b.left - 30 && e.clientX <= b.right + 30 && e.clientY >= b.top - 20 && e.clientY <= b.bottom + 20;
      if (!inside) { this.hovered = null; this.pointerIn = false; return; }
      const x = e.clientX - b.left;
      if (this.navGrad) {
        this.navGrad.setAttribute('cx', String(x));
        this.navGrad.setAttribute('cy', String(e.clientY - b.top));
      }
      let nearest = null, shortest = Infinity;
      this.rects().forEach((r, i) => {
        const dist = x < r.x ? r.x - x : x > r.x + r.width ? x - (r.x + r.width) : 0;
        if (dist < shortest) { shortest = dist; nearest = i; }
      });
      this.hovered = nearest;
      this.pointerIn = true;
    };
    document.addEventListener('mousemove', this._pointer, { passive: true });
  }

  rects() {
    if (!this.navWrap) return [];
    return this.navItems.map(el => {
      let x = el.offsetLeft, y = el.offsetTop, p = el.offsetParent;
      while (p && p !== this.navWrap) { x += p.offsetLeft; y += p.offsetTop; p = p.offsetParent; }
      return { x, y, width: el.offsetWidth, height: el.offsetHeight };
    });
  }

  // A bare anchor jumps; taking the click over is the only way to ease it.
  glide(target) {
    const to = target.getBoundingClientRect().top + window.scrollY;
    const from = window.scrollY;
    const dist = to - from;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches || Math.abs(dist) < 1) {
      window.scrollTo(0, to);
      return;
    }
    cancelAnimationFrame(this._glide);
    const began = performance.now();
    const dur = 700;
    this.lockUntil = began + dur + 150;
    const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const step = now => {
      const p = Math.min((now - began) / dur, 1);
      window.scrollTo(0, from + dist * ease(p));
      if (p < 1) this._glide = requestAnimationFrame(step);
    };
    this._glide = requestAnimationFrame(step);
  }

  // Whichever section crosses the middle of the viewport is the one being read.
  readSection() {
    if (!this.onHome || !this.sections) return;
    if (performance.now() < (this.lockUntil || 0)) return;
    const line = window.innerHeight * 0.45;
    let found = -1;
    this.sections.forEach((el, i) => {
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.top <= line && r.bottom > line) found = i;
    });
    if (found !== -1) this.active = found;
  }

  setMenu(open) {
    if (!this.menu || this.menuOpen === open) return;
    this.menuOpen = open;
    this.menu.style.pointerEvents = open ? 'auto' : 'none';
    this.menu.setAttribute('aria-hidden', open ? 'false' : 'true');
    const btn = document.getElementById('menu-btn');
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    this.menuBars.forEach((bar, i) => {
      bar.style.transitionDelay = (open ? i * 18 : (this.menuBars.length - 1 - i) * 14) + 'ms';
      bar.style.transform = 'scaleY(' + (open ? 1 : 0) + ')';
    });
    if (this.menuContent) {
      this.menuContent.style.transitionDelay = open ? '260ms' : '0ms';
      this.menuContent.style.opacity = open ? '1' : '0';
    }
    document.documentElement.style.overflow = open ? 'hidden' : '';
    if (open) {
      const close = document.getElementById('menu-close');
      if (close) setTimeout(() => close.focus(), 300);
    }
  }

  fitNav() {
    if (!this.navWrap || !this.topbar) return true;
    const btn = document.getElementById('menu-btn');
    // Measured from the row's own resting extent each time rather than cached —
    // a stale cache from a previous type size makes the row vanish.
    if (this.navWrap.offsetWidth) {
      const r = this.rects();
      if (r.length) this.navFullWidth = r[r.length - 1].x + r[r.length - 1].width - r[0].x + this.push * (r.length - 1);
    }
    const need = (this.navFullWidth || this.navWrap.scrollWidth)
      + (this.brand ? this.brand.offsetWidth : 150)
      + (btn ? btn.offsetWidth : 94) + 76 + 42;
    const wide = this.topbar.clientWidth >= need;
    if (wide !== this.navWide) {
      this.navWide = wide;
      this.navWrap.style.display = wide ? 'block' : 'none';
      if (this.navMini) this.navMini.style.display = wide ? 'none' : 'flex';
    }
    return wide;
  }

  drawNav(dt) {
    if (!this.navBase || !this.navItems.length) return;
    if (!this.fitNav() || !this.navWrap.offsetWidth) return;
    const base = this.rects();
    if (!base.length || !base[0].height) return;

    const isOpen = i => i === this.hovered || i === this.active;
    // A gap opens once however many of its two pills are involved, on a spring
    // (stiffness 260, damping 30) — the same feel as the source component.
    if (!this.vel || this.vel.length !== base.length - 1) this.vel = new Array(base.length - 1).fill(0);
    const step = Math.min(dt, 33) / 1000;
    for (let i = 0; i < base.length - 1; i++) {
      const t = isOpen(i) || isOpen(i + 1) ? 1 : 0;
      const x = this.open[i] || 0;
      const v = this.vel[i] || 0;
      if (Math.abs(x - t) < 0.002 && Math.abs(v) < 0.02) { this.open[i] = t; this.vel[i] = 0; continue; }
      const a = -260 * (x - t) - 30 * v;
      this.vel[i] = v + a * step;
      this.open[i] = x + this.vel[i] * step;
    }

    const xs = [base[0].x];
    for (let i = 1; i < base.length; i++) {
      xs[i] = xs[i - 1] + base[i - 1].width + (base[i].x - (base[i - 1].x + base[i - 1].width)) + this.push * (this.open[i - 1] || 0);
    }
    // Anchored on the row's ink, not its bounding box: pills differ in width and
    // the extra room appears at one gap, so holding the box still lets the
    // weight drift inside it.
    const balance = arr => {
      let moment = 0, total = 0;
      for (let i = 0; i < base.length; i++) {
        moment += (arr[i] + base[i].width / 2) * base[i].width;
        total += base[i].width;
      }
      return total > 0 ? moment / total : 0;
    };
    const offset = balance(base.map(r => r.x)) - balance(xs);
    const shaped = base.map((r, i) => ({ ...r, x: xs[i] + offset }));
    const h = shaped[0].height;
    const radius = h / 2;

    // One path for pills AND waists: each waist tucks its ends inside the pills
    // it joins, and separate elements paint those overlaps twice — invisible
    // under an opaque fill, but a bright seam under the translucent halo.
    const parts = shaped.map(r => pillPath(r, radius));
    for (let i = 0; i < shaped.length - 1; i++) {
      const d = waistPath(shaped[i], shaped[i + 1], radius, h * 0.4, this.open[i] || 0);
      if (d) parts.push(d);
    }
    const data = parts.join(' ');
    this.navBase.setAttribute('d', data);
    if (this.navHalo) {
      this.navHalo.setAttribute('d', data);
      this.navHalo.style.opacity = this.pointerIn ? '1' : '0';
    }
    this.navItems.forEach((el, i) => {
      el.style.transform = 'translateX(' + (shaped[i].x - base[i].x).toFixed(2) + 'px)';
      const dot = el.querySelector('[data-dot]');
      if (dot) dot.style.opacity = i === this.active ? '1' : '0';
      el.style.color = i === this.active || i === this.hovered ? '#ffffff' : 'rgba(255,255,255,0.78)';
    });
  }

  tick(now) {
    const t = now || performance.now();
    const dt = Math.min(64, t - this.last);
    this.last = t;
    // Any node can be swapped out by a direct edit or a re-render, so the whole
    // cache is re-read whenever a representative of it goes stale.
    if (!this.navBase || !this.navBase.isConnected || !this.bulb || !this.bulb.isConnected) this.collect();

    this.smooth += (this.target - this.smooth) * (1 - Math.pow(0.014, dt / 1000));
    const s = this.smooth;

    if (this.bulb && this.bulbRail) {
      const span = this.bulbRail.clientHeight - 24;
      const y = s * span;
      this.bulb.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
      this.history.unshift(y);
      if (this.history.length > 240) this.history.pop();
      if (Math.abs(this.target - s) > 0.0003) this.trailSeen = t;
      const lingering = t - (this.trailSeen || 0) < 900;
      this.trail.forEach((el, i) => {
        const h = this.history[Math.min(this.history.length - 1, 14 + i * 18)];
        if (h == null) return;
        el.style.transform = 'translate3d(0,' + (h + 6).toFixed(1) + 'px,0)';
        el.style.opacity = (lingering ? (1 - i / (this.trail.length + 1)) * 0.75 : 0).toFixed(3);
        el.style.transition = 'opacity 900ms ease';
      });
    }

    if (this.topbar) {
      const on = window.scrollY > 60;
      this.topbar.style.transition = 'background-color 400ms ease, border-color 400ms ease';
      this.topbar.style.borderBottom = '1px solid ' + (on ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0)');
      this.topbar.style.backgroundColor = on ? 'rgba(5,6,9,0.6)' : 'rgba(5,6,9,0)';
      this.topbar.style.backdropFilter = on ? 'blur(16px)' : 'none';
    }

    this.readSection();
    this.drawNav(dt);
    this._raf = requestAnimationFrame(t2 => this.tick(t2));
  }

  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
    if (this._wake) {
      document.removeEventListener('visibilitychange', this._wake);
      window.removeEventListener('focus', this._wake);
    }
    if (this._esc) window.removeEventListener('keydown', this._esc);
    document.removeEventListener('mousemove', this._pointer);
    window.removeEventListener('scroll', this._read);
    window.removeEventListener('resize', this._read);
    document.documentElement.style.overflow = '';
  }

  renderVals() { return {}; }
}
</script>
</body>
